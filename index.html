<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness GUI</title>
    <style>
      :root {
        color-scheme: light;
        --bg-color: #ffffff;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --accent-blue: #2563eb;
        --accent-blue-light: #3b82f6;
        --accent-blue-soft: #eff6ff;
        --accent-blue-border: #bfdbfe;
        --card-bg: #f8fafc;
        --card-border: #e2e8f0;
        --card-hover-border: #cbd5e1;
        --success-color: #10b981;
        --warning-color: #f59e0b;
        --danger-color: #ef4444;
        --danger-soft: #fef2f2;
        --modal-bg: #ffffff;
        --modal-shadow: 0 25px 60px -12px rgba(15, 23, 42, 0.22);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg-color);
        background-image: radial-gradient(circle at 50% 40%, #f1f5f9 0%, #ffffff 70%);
        color: var(--text-primary);
        user-select: none;
        overflow: hidden;
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      body.fade-out {
        opacity: 0;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 440px;
        width: 90%;
        text-align: center;
        animation: fadeIn 0.5s ease-out;
        z-index: 10;
      }

      /* Logo 区域 */
      .brand-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-bottom: 28px;
      }

      .logo-icon {
        width: 58px;
        height: 58px;
        border-radius: 16px;
        background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
        border: 1px solid #bfdbfe;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 16px rgba(37, 99, 235, 0.1);
        animation: float 3.2s ease-in-out infinite;
      }

      .logo-icon svg {
        width: 34px;
        height: 34px;
        fill: var(--accent-blue);
      }

      .logo-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--text-primary);
      }

      .badge {
        font-size: 11px;
        font-weight: 600;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--accent-blue);
        background: #eff6ff;
        border: 1px solid #dbeafe;
        padding: 2px 8px;
        border-radius: 9999px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      /* Loading 状态指示器 */
      .loading-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: 100%;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid #e2e8f0;
        border-top-color: var(--accent-blue);
        border-radius: 50%;
        animation: spin 0.85s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
      }

      .progress-bar-container {
        width: 220px;
        height: 4px;
        background: #e2e8f0;
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }

      .progress-bar-inner {
        position: absolute;
        top: 0;
        bottom: 0;
        background: linear-gradient(90deg, #3b82f6, #2563eb);
        border-radius: 9999px;
        animation: indeterminate 1.8s infinite ease-in-out;
      }

      .hint-wrapper {
        min-height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hint {
        font-size: 13.5px;
        color: var(--text-secondary);
        font-weight: 450;
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      .hint.updating {
        opacity: 0;
        transform: translateY(2px);
      }

      .sub-hint {
        font-size: 11.5px;
        color: var(--text-muted);
        margin-top: 4px;
      }

      /* 错误展示卡片 */
      .error-card {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        background: #ffffff;
        border: 1px solid #fecaca;
        box-shadow: 0 8px 24px rgba(239, 68, 68, 0.08);
        border-radius: 14px;
        padding: 22px;
        width: 100%;
        animation: shake 0.4s ease-out;
      }

      .error-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--danger-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--danger-color);
      }

      .error-title {
        font-size: 15px;
        font-weight: 600;
        color: #991b1b;
      }

      .error-message {
        font-size: 12px;
        color: #7f1d1d;
        line-height: 1.5;
        word-break: break-word;
        max-height: 86px;
        overflow-y: auto;
        background: #fef2f2;
        padding: 10px 12px;
        border-radius: 8px;
        width: 100%;
        text-align: left;
        font-family: ui-monospace, Menlo, monospace;
      }

      .diagnostic-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        width: 100%;
      }

      .btn-action-base {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.16s ease;
      }

      .btn-primary-action {
        background: var(--accent-blue);
        border: 1px solid var(--accent-blue);
        color: #ffffff;
      }

      .btn-primary-action:hover {
        background: #1d4ed8;
        border-color: #1d4ed8;
      }

      .btn-secondary-action {
        background: #f8fafc;
        border: 1px solid var(--card-border);
        color: var(--text-primary);
      }

      .btn-secondary-action:hover {
        background: #f1f5f9;
        border-color: #cbd5e1;
      }

      /* 底部常驻悬浮胶囊按钮 */
      .diagnostics-fab {
        position: fixed;
        right: 20px;
        bottom: 18px;
        z-index: 100;
      }

      .diagnostics-trigger {
        height: 38px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        border: 1px solid rgba(203, 213, 225, 0.85);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 4px 18px rgba(15, 23, 42, 0.08);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(12px);
        transition: all 0.18s ease;
      }

      .diagnostics-trigger:hover {
        color: var(--accent-blue);
        border-color: var(--accent-blue-border);
        box-shadow: 0 6px 22px rgba(37, 99, 235, 0.12);
        transform: translateY(-1px);
      }

      .fab-pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--warning-color);
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5);
        animation: pulse-dot 2s infinite;
      }

      .fab-pulse-dot.ready {
        background-color: var(--success-color);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5);
      }

      .fab-pulse-dot.error {
        background-color: var(--danger-color);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
      }

      .fab-shortcut {
        font-size: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--text-muted);
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        padding: 1px 5px;
        border-radius: 4px;
      }

      /* 模态对话框背景与卡片 (System & Diagnostics Modal) */
      .diagnostics-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }

      .diagnostics-modal-backdrop.is-open {
        opacity: 1;
        visibility: visible;
      }

      .diagnostics-modal-dialog {
        background: var(--modal-bg);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        box-shadow: var(--modal-shadow);
        width: 640px;
        max-width: 94vw;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform: translateY(12px) scale(0.97);
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .diagnostics-modal-backdrop.is-open .diagnostics-modal-dialog {
        transform: translateY(0) scale(1);
      }

      /* 模态头部 */
      .diag-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 22px;
        border-bottom: 1px solid var(--card-border);
        background: #fafcff;
      }

      .diag-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .diag-brand-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
        border: 1px solid #bfdbfe;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.08);
      }

      .diag-brand-icon svg {
        width: 22px;
        height: 22px;
        fill: var(--accent-blue);
      }

      .diag-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .diag-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
      }

      .diag-version-badge {
        font-size: 11px;
        font-weight: 600;
        font-family: ui-monospace, Menlo, monospace;
        color: #2563eb;
        background: #eff6ff;
        border: 1px solid #dbeafe;
        padding: 1px 6px;
        border-radius: 6px;
      }

      .diag-subtitle {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 1px;
      }

      .diag-header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .diag-status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .diag-btn-close {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        border: 0;
        background: transparent;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .diag-btn-close:hover {
        background: #f1f5f9;
        color: var(--text-primary);
      }

      /* 模态主体 */
      .diag-body {
        padding: 20px 22px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .diag-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .diag-section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .diag-section-title {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--text-secondary);
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .diag-section-sub {
        font-size: 11px;
        color: var(--text-muted);
      }

      /* 遥测 4 宫格 */
      .telemetry-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .telemetry-card {
        background: #f8fafc;
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-align: left;
      }

      .telemetry-label {
        font-size: 11px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .telemetry-value {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .telemetry-run-id-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 11px;
      }

      .run-id-label {
        color: var(--text-muted);
        font-weight: 500;
      }

      .run-id-code {
        font-family: ui-monospace, Menlo, monospace;
        color: var(--text-primary);
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .btn-copy-mini {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: 0;
        background: #ffffff;
        color: var(--accent-blue);
        border: 1px solid #dbeafe;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .btn-copy-mini:hover {
        background: #eff6ff;
        border-color: #bfdbfe;
      }

      /* 诊断工具箱卡片 2x2 */
      .action-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .action-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        background: #ffffff;
        border: 1px solid var(--card-border);
        border-radius: 12px;
        cursor: pointer;
        text-align: left;
        transition: all 0.16s ease;
      }

      .action-card:hover {
        border-color: #93c5fd;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.08);
        transform: translateY(-1px);
        background: #fafcff;
      }

      .action-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .action-icon-blue { background: #eff6ff; color: #2563eb; }
      .action-icon-indigo { background: #eef2ff; color: #4f46e5; }
      .action-icon-teal { background: #f0fdf4; color: #059669; }
      .action-icon-amber { background: #fffbeb; color: #d97706; }

      .action-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow: hidden;
      }

      .action-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .action-desc {
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 版本升级中心卡片 */
      .update-hub-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        background: linear-gradient(135deg, #f0f7ff 0%, #f8fafc 100%);
        border: 1px solid #dbeafe;
        border-radius: 12px;
      }

      .update-hub-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .update-hub-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: #dbeafe;
        color: var(--accent-blue);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .update-hub-headline {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .update-hub-desc {
        font-size: 11.5px;
        color: var(--text-secondary);
        margin-top: 1px;
      }

      .btn-update-action {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 16px;
        background: var(--accent-blue);
        border: 0;
        border-radius: 8px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.16s ease;
        flex-shrink: 0;
      }

      .btn-update-action:hover {
        background: #1d4ed8;
      }

      .btn-update-action.loading svg {
        animation: spin 0.8s linear infinite;
      }

      /* 底部状态反馈 Toast */
      .diag-footer {
        padding: 10px 22px 14px;
        background: #f8fafc;
        border-top: 1px solid var(--card-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .diag-toast {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-secondary);
        max-width: 420px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .diag-toast.is-success { color: #047857; }
      .diag-toast.is-error { color: #b91c1c; }

      .diag-footer-hint {
        font-size: 11px;
        color: var(--text-muted);
      }

      kbd {
        display: inline-block;
        padding: 1px 4px;
        font-size: 10px;
        font-family: ui-monospace, Menlo, monospace;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.05);
      }

      @media (max-width: 600px) {
        .telemetry-grid {
          grid-template-columns: 1fr 1fr;
        }
        .action-grid {
          grid-template-columns: 1fr;
        }
        .update-hub-card {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
        .btn-update-action {
          width: 100%;
          justify-content: center;
        }
        .diagnostics-trigger .fab-shortcut {
          display: none;
        }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes indeterminate {
        0% { left: -40%; width: 40%; }
        50% { left: 30%; width: 60%; }
        100% { left: 100%; width: 40%; }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-4px); }
        40%, 80% { transform: translateX(4px); }
      }

      @keyframes pulse-dot {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.6); }
        70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(37, 99, 235, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
      }
    </style>
  </head>
  <body>
    <!-- 启动加载主容器 -->
    <div class="container">
      <div class="brand-box">
        <div class="logo-icon">
          <!-- DeepSeek Whale 徽标 -->
          <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path

      /** 格式化字节大小 */
      function formatBytes(bytes) {
        if (!bytes || bytes <= 0) return "0 B";
        const k = 1024;
        const sizes = ["B", "KB", "MB", "GB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
      }

      /** 在诊断中心底部显示动态 Toast 提示 */
      function showToast(message, type = "info") {
        if (!toastText || !toastContainer) return;
        toastText.textContent = message;
        toastContainer.className = "diag-toast";
        if (type === "success") toastContainer.classList.add("is-success");
        else if (type === "error") toastContainer.classList.add("is-error");
      }

      /** 刷新并渲染遥测数据 */
      async function refreshTelemetry() {
        try {
          const summary = await invoke("get_diagnostics_summary");
          currentSummary = summary;

          if (headerVersion) headerVersion.textContent = `v${summary.appVersion}`;
          if (telemetryOs) telemetryOs.textContent = `${summary.platform} (${summary.arch})`;
          if (telemetryDuration) telemetryDuration.textContent = `${(summary.durationMs / 1000).toFixed(2)} s`;
          if (telemetryPort) {
            telemetryPort.textContent = summary.port ? `127.0.0.1:${summary.port}` : "正在分配…";
          }
          if (telemetryLogSize) {
            telemetryLogSize.textContent = formatBytes(summary.logDirSizeBytes);
          }
          if (telemetryRunId) {
            telemetryRunId.textContent = summary.runId || "--";
          }

          // 状态指示
          if (statusPillText) {
            if (summary.errorSummary) {
              statusPillText.textContent = "启动遇到异常";
              statusPillText.style.color = "#ef4444";
              if (fabPulseDot) fabPulseDot.className = "fab-pulse-dot error";
            } else if (summary.phase === "navigation_complete") {
              statusPillText.textContent = "🟢 引擎运行中";
              statusPillText.style.color = "#10b981";
              if (fabPulseDot) fabPulseDot.className = "fab-pulse-dot ready";
            } else {
              statusPillText.textContent = "🟡 启动中…";
              statusPillText.style.color = "#f59e0b";
              if (fabPulseDot) fabPulseDot.className = "fab-pulse-dot";
            }
          }
        } catch (e) {
          showToast(`获取遥测失败: ${e}`, "error");
        }
      }

      /** 打开系统控制与诊断中心 */
      function openModal() {
        modalBackdrop?.classList.add("is-open");
        modalBackdrop?.setAttribute("aria-hidden", "false");
        refreshTelemetry();
      }

      /** 关闭系统控制与诊断中心 */
      function closeModal() {
        modalBackdrop?.classList.remove("is-open");
        modalBackdrop?.setAttribute("aria-hidden", "true");
        diagnosticsTrigger?.focus();
      }

      /** 打开本地日志目录 */
      async function openLogs() {
        try {
          await invoke("open_log_directory");
          showToast("已在文件管理器中打开日志目录", "success");
        } catch (error) {
          showToast(`打开日志失败: ${error}`, "error");
        }
      }

      /** 导出脱敏诊断包 */
      async function exportDiagnostics() {
        try {
          showToast("正在打包诊断日志…");
          const path = await invoke("export_diagnostics_default");
          showToast(`已导出诊断包：${path}`, "success");
        } catch (error) {
          showToast(`导出失败: ${error}`, "error");
        }
      }

      /** 复制诊断摘要到剪贴板 */
      async function copyDiagnostics() {
        try {
          await invoke("copy_diagnostics_summary");
          showToast("诊断摘要已成功复制到剪贴板", "success");
        } catch (error) {
          showToast(`复制失败: ${error}`, "error");
        }
      }

      /** 复制 Run ID */
      async function copyRunId() {
        if (!currentSummary?.runId) return;
        try {
          await navigator.clipboard.writeText(currentSummary.runId);
          showToast("运行编号已复制到剪贴板", "success");
        } catch {
          showToast(`Run ID: ${currentSummary.runId}`, "info");
        }
      }

      /** 检查更新流程 */
      async function checkForUpdate() {
        if (!btnCheckUpdate) return;
        btnCheckUpdate.classList.add("loading");
        if (btnUpdateText) btnUpdateText.textContent = "正在检查…";
        showToast("正在从 GitHub Releases 检查最新版本…");

        try {
          const update = await invoke("check_for_update");
          if (update && update.available) {
            if (updateHeadline) updateHeadline.textContent = `发现新版本 v${update.version}`;
            if (updateDesc) updateDesc.textContent = update.body ? update.body.slice(0, 80) + "…" : "包含多项性能与稳定性提升";
            showToast(`发现新版本 v${update.version}，正在唤起安装确认…`, "success");
            // 触发原生确认安装流
            await invoke("manual_check_for_update");
          } else {
            if (updateHeadline) updateHeadline.textContent = "当前已是最新版本";
            if (updateDesc) updateDesc.textContent = `DeepSeek Harness GUI ${currentSummary?.appVersion ? "v" + currentSummary.appVersion : ""} · 官方稳定版本`;
            showToast("当前已是最新版本，无需更新", "success");
          }
        } catch (error) {
          showToast(`检查更新失败: ${error}`, "error");
        } finally {
          btnCheckUpdate.classList.remove("loading");
          if (btnUpdateText) btnUpdateText.textContent = "检查更新";
        }
      }

      /** 重启应用程序与引擎 */
      async function restartEngine() {
        try {
          showToast("正在重启 Harness 引擎…");
          await invoke("restart_application");
        } catch (e) {
          location.reload();
        }
      }

      // 平滑更新提示文字
      function updateHint(text) {
        if (!hint) return;
        hint.classList.add("updating");
        setTimeout(() => {
          hint.textContent = text;
          hint.classList.remove("updating");
        }, 150);
      }

      // 切换为错误状态
      function showError(errText) {
        if (loadingBox) loadingBox.style.display = "none";
        if (errorBox) {
          errorBox.style.display = "flex";
          if (errorMessage) errorMessage.textContent = errText || "未能获取启动日志，请查看控制台输出";
        }
        if (fabPulseDot) fabPulseDot.className = "fab-pulse-dot error";
      }

      // 监听启动进度事件
      listen("startup-progress", (e) => {
        const text = String(e.payload || "");
        updateHint(text);

        if (text.includes("解压")) {
          if (subHint) subHint.textContent = "首次运行展开运行时依赖，可能需要 5~10 秒";
        } else if (text.includes("加载界面")) {
          if (subHint) subHint.textContent = "";
          if (fabPulseDot) fabPulseDot.className = "fab-pulse-dot ready";
          setTimeout(() => {
            document.body.classList.add("fade-out");
          }, 120);
        }
      }).catch(() => {});

      // 监听启动错误事件
      listen("startup-error", (e) => {
        showError(String(e.payload || ""));
      }).catch(() => {});

      // 监听托盘或外部发送的打开诊断事件
      listen("harness:toggle-diagnostics", () => {
        openModal();
      }).catch(() => {});

      // 事件绑定
      document.getElementById("btn-retry")?.addEventListener("click", () => location.reload());
      document.getElementById("btn-open-logs")?.addEventListener("click", openLogs);
      document.getElementById("btn-export-diagnostics")?.addEventListener("click", exportDiagnostics);
      document.getElementById("btn-open-modal-from-error")?.addEventListener("click", openModal);

      diagnosticsTrigger?.addEventListener("click", openModal);
      btnCloseModal?.addEventListener("click", closeModal);

      document.getElementById("card-open-logs")?.addEventListener("click", openLogs);
      document.getElementById("card-export-diagnostics")?.addEventListener("click", exportDiagnostics);
      document.getElementById("card-copy-diagnostics")?.addEventListener("click", copyDiagnostics);
      document.getElementById("card-restart-app")?.addEventListener("click", restartEngine);
      document.getElementById("btn-copy-run-id")?.addEventListener("click", copyRunId);
      document.getElementById("btn-diag-check-update")?.addEventListener("click", checkForUpdate);

      modalBackdrop?.addEventListener("click", (e) => {
        if (e.target === modalBackdrop) closeModal();
      });

      // 全局快捷键：Ctrl+Shift+D 或 F1 唤出诊断中心，Esc 关闭
      document.addEventListener("keydown", (event) => {
        if ((event.ctrlKey && event.shiftKey && event.key.toLowerCase() === "d") || event.key === "F1") {
          event.preventDefault();
          if (modalBackdrop?.classList.contains("is-open")) {
            closeModal();
          } else {
            openModal();
          }
        } else if (event.key === "Escape") {
          if (modalBackdrop?.classList.contains("is-open")) {
            closeModal();
          }
        }
      });

      // 初始化遥测
      refreshTelemetry();

      // 前端超时看门狗：35秒未导航给予刷新指引
      setTimeout(() => {
        if (loadingBox && loadingBox.style.display !== "none") {
          if (subHint) {
            subHint.innerHTML = '启动时间较长？可按 <kbd>Ctrl+Shift+D</kbd> 查看诊断或 <a href="#" id="retry-link" style="color:#2563eb;text-decoration:underline;">刷新重试</a>';
            document.getElementById("retry-link")?.addEventListener("click", (e) => {
              e.preventDefault();
              location.reload();
            });
          }
        }
      }, 35000);
    </script>
  </body>
</html>
