<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: light;
        --bg-color: #ffffff;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --text-muted: #94a3b8;
        --accent-blue: #2563eb;
        --accent-blue-light: #3b82f6;
        --card-bg: #f8fafc;
        --card-border: #e2e8f0;
        --danger-color: #ef4444;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg-color);
        background-image: radial-gradient(circle at 50% 40%, #f1f5f9 0%, #ffffff 70%);
        color: var(--text-primary);
        user-select: none;
        overflow: hidden;
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      body.fade-out {
        opacity: 0;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 420px;
        width: 90%;
        text-align: center;
        animation: fadeIn 0.5s ease-out;
      }

      /* Logo 区域 */
      .brand-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-bottom: 28px;
      }

      .logo-icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
        border: 1px solid #bfdbfe;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
        animation: float 3s ease-in-out infinite;
      }

      .logo-icon svg {
        width: 32px;
        height: 32px;
        fill: var(--accent-blue);
      }

      .logo-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--text-primary);
      }

      .badge {
        font-size: 11px;
        font-weight: 600;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--accent-blue);
        background: #eff6ff;
        border: 1px solid #dbeafe;
        padding: 2px 7px;
        border-radius: 9999px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      /* Loading 状态指示器 */
      .loading-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: 100%;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid #e2e8f0;
        border-top-color: var(--accent-blue);
        border-radius: 50%;
        animation: spin 0.85s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
      }

      .progress-bar-container {
        width: 200px;
        height: 3px;
        background: #e2e8f0;
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }

      .progress-bar-inner {
        position: absolute;
        top: 0;
        bottom: 0;
        background: linear-gradient(90deg, #3b82f6, #2563eb);
        border-radius: 9999px;
        animation: indeterminate 1.8s infinite ease-in-out;
      }

      .hint-wrapper {
        min-height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hint {
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 400;
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      .hint.updating {
        opacity: 0;
        transform: translateY(2px);
      }

      .sub-hint {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 4px;
      }

      /* 错误展示卡片 */
      .error-card {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        background: #fff;
        border: 1px solid #fee2e2;
        box-shadow: 0 4px 16px rgba(239, 68, 68, 0.08);
        border-radius: 12px;
        padding: 20px;
        width: 100%;
        animation: shake 0.4s ease-out;
      }

      .error-icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #fef2f2;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--danger-color);
      }

      .error-title {
        font-size: 14px;
        font-weight: 600;
        color: #991b1b;
      }

      .error-message {
        font-size: 12px;
        color: #7f1d1d;
        line-height: 1.5;
        word-break: break-word;
        max-height: 80px;
        overflow-y: auto;
        background: #fef2f2;
        padding: 8px 12px;
        border-radius: 6px;
        width: 100%;
        text-align: left;
        font-family: ui-monospace, Menlo, monospace;
      }

      .btn-retry {
        margin-top: 6px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        background: #f1f5f9;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-primary);
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .btn-retry:hover {
        background: #e2e8f0;
        border-color: #94a3b8;
      }

      .diagnostic-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }

      /* 启动页诊断入口：固定在视觉边缘，避免打断品牌与启动状态的主层级。 */
      .diagnostics-fab {
        position: fixed;
        right: 20px;
        bottom: 18px;
        z-index: 20;
      }

      .diagnostics-trigger {
        height: 38px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 0 13px;
        border: 1px solid rgba(148, 163, 184, 0.42);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: color 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
      }

      .diagnostics-trigger:hover,
      .diagnostics-trigger[aria-expanded="true"] {
        color: var(--accent-blue);
        border-color: #bfdbfe;
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
        transform: translateY(-1px);
      }

      .diagnostics-trigger:focus-visible,
      .diagnostics-menu-button:focus-visible {
        outline: 2px solid #93c5fd;
        outline-offset: 2px;
      }

      .diagnostics-popover {
        position: absolute;
        right: 0;
        bottom: 48px;
        width: 224px;
        padding: 8px;
        border: 1px solid var(--card-border);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.97);
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.13);
        opacity: 0;
        visibility: hidden;
        transform: translateY(6px) scale(0.98);
        transform-origin: bottom right;
        transition: opacity 0.16s ease, visibility 0.16s ease, transform 0.16s ease;
        backdrop-filter: blur(14px);
      }

      .diagnostics-fab.is-open .diagnostics-popover {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }

      .diagnostics-popover-title {
        padding: 6px 9px 7px;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .diagnostics-menu-button {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text-primary);
        font-size: 12px;
        text-align: left;
        cursor: pointer;
      }

      .diagnostics-menu-button:hover {
        background: #f1f5f9;
      }

      .diagnostics-menu-button svg {
        flex: 0 0 auto;
        color: var(--text-secondary);
      }

      .diagnostics-status {
        min-height: 18px;
        padding: 5px 9px 2px;
        color: var(--text-secondary);
        font-size: 10px;
        line-height: 1.35;
        word-break: break-word;
      }

      @media (max-width: 520px) {
        .diagnostics-fab {
          right: 14px;
          bottom: 14px;
        }

        .diagnostics-trigger span {
          display: none;
        }

        .diagnostics-trigger {
          width: 38px;
          padding: 0;
          justify-content: center;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes indeterminate {
        0% {
          left: -40%;
          width: 40%;
        }
        50% {
          left: 30%;
          width: 60%;
        }
        100% {
          left: 100%;
          width: 40%;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-3px);
        }
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-4px); }
        40%, 80% { transform: translateX(4px); }
      }
    </style>
  </head>

      <!-- 加载容器 -->

    <script type="module">
      import { listen } from "@tauri-apps/api/event";
      import { invoke } from "@tauri-apps/api/core";

      const hint = document.getElementById("hint");
      const subHint = document.getElementById("sub-hint");
      const loadingBox = document.getElementById("loading-box");
      const errorBox = document.getElementById("error-box");
      const errorMessage = document.getElementById("error-message");
      const diagnosticsFab = document.getElementById("diagnostics-fab");
      const diagnosticsTrigger = document.getElementById("diagnostics-trigger");
      const diagnosticsStatus = document.getElementById("diagnostics-status");

      /**
       * 在诊断弹层底部显示最近一次操作结果。
       *
       * @param {string} text - 需要展示的状态文本。
       * @param {boolean} [isError=false] - 是否使用错误状态颜色。
       */
      function setDiagnosticsStatus(text, isError = false) {
        if (!diagnosticsStatus) return;
        diagnosticsStatus.textContent = text;
        diagnosticsStatus.style.color = isError ? "#b91c1c" : "";
        diagnosticsFab?.classList.add("is-open");
        diagnosticsTrigger?.setAttribute("aria-expanded", "true");
      }

      /** 收起诊断弹层并同步无障碍展开状态。 */
      function closeDiagnostics() {
        diagnosticsFab?.classList.remove("is-open");
        diagnosticsTrigger?.setAttribute("aria-expanded", "false");
      }

      /** 打开本次应用运行所使用的本地日志目录。 */
      async function openLogs() {
        try {
          await invoke("open_log_directory");
          setDiagnosticsStatus("已打开日志目录");
        } catch (error) {
          setDiagnosticsStatus(String(error), true);
        }
      }

      /** 导出经过脱敏处理的本地诊断包。 */
      async function exportDiagnostics() {
        try {
          const path = await invoke("export_diagnostics_default");
          setDiagnosticsStatus(`已导出：${path}`);
        } catch (error) {
          setDiagnosticsStatus(String(error), true);
        }
      }

      /** 将经过脱敏处理的诊断摘要复制到系统剪贴板。 */
      async function copyDiagnostics() {
        try {
          await invoke("copy_diagnostics_summary");
          setDiagnosticsStatus("诊断摘要已复制");
        } catch (error) {
          setDiagnosticsStatus(String(error), true);
        }
      }

      /** 触发签名更新检查，并在发现新版本时显示原生确认窗口。 */
      async function checkForUpdate() {
        setDiagnosticsStatus("正在检查更新…");
        try {
          await invoke("manual_check_for_update");
          setDiagnosticsStatus("更新检查已完成");
        } catch (error) {
          setDiagnosticsStatus(String(error), true);
        }
      }

      /** 读取并展示当前应用版本及本次运行编号。 */
      async function showVersion() {
        try {
          const summary = await invoke("get_diagnostics_summary");
          setDiagnosticsStatus(`v${summary.appVersion} · ${summary.runId}`);
        } catch (error) {
          setDiagnosticsStatus(String(error), true);
        }
      }

      // 平滑更新提示文字
      function updateHint(text) {
        if (!hint) return;
        hint.classList.add("updating");
        setTimeout(() => {
          hint.textContent = text;
          hint.classList.remove("updating");
        }, 150);
      }

      // 切换为错误状态
      function showError(errText) {
        if (loadingBox) loadingBox.style.display = "none";
        if (errorBox) {
          errorBox.style.display = "flex";
          if (errorMessage) errorMessage.textContent = errText || "未知异常，请查看后台控制台日志";
        }
      }

      // 监听启动进度事件
      listen("startup-progress", (e) => {
        const text = String(e.payload || "");
        updateHint(text);

        if (text.includes("解压")) {
          if (subHint) subHint.textContent = "首次运行正在展开运行时依赖，可能需要 5~10 秒";
        } else if (text.includes("加载界面")) {
          if (subHint) subHint.textContent = "";
          // 准备跳转前微淡出，减少视觉硬跳变
          setTimeout(() => {
            document.body.classList.add("fade-out");
          }, 120);
        }
      }).catch(() => {});

      // 监听启动错误事件
      listen("startup-error", (e) => {
        showError(String(e.payload || ""));
      }).catch(() => {});

      // 重试按钮：刷新重载（移入外部脚本以兼容严格 CSP）
      document.getElementById("btn-retry")?.addEventListener("click", () => {
        location.reload();
      });
      document.getElementById("btn-open-logs")?.addEventListener("click", openLogs);
      document.getElementById("btn-export-diagnostics")?.addEventListener("click", exportDiagnostics);
      document.getElementById("btn-copy-error")?.addEventListener("click", copyDiagnostics);
      document.getElementById("fab-open-logs")?.addEventListener("click", openLogs);
      document.getElementById("fab-export-diagnostics")?.addEventListener("click", exportDiagnostics);
      document.getElementById("fab-copy-diagnostics")?.addEventListener("click", copyDiagnostics);
      document.getElementById("fab-check-update")?.addEventListener("click", checkForUpdate);
      document.getElementById("fab-show-version")?.addEventListener("click", showVersion);
      diagnosticsTrigger?.addEventListener("click", () => {
        const isOpen = diagnosticsFab?.classList.toggle("is-open") ?? false;
        diagnosticsTrigger.setAttribute("aria-expanded", String(isOpen));
        if (isOpen) document.getElementById("fab-open-logs")?.focus();
      });
      document.addEventListener("click", (event) => {
        if (diagnosticsFab && !diagnosticsFab.contains(event.target)) closeDiagnostics();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeDiagnostics();
          diagnosticsTrigger?.focus();
        }
      });

      // 前端超时看门狗：如果 35 秒内仍未导航，给予友善提示与刷新重试按钮
      setTimeout(() => {
        if (loadingBox && loadingBox.style.display !== "none") {
          if (subHint) {
            subHint.innerHTML = '启动时间较长？可尝试 <a href="#" id="retry-link" style="color:#2563eb;text-decoration:underline;">刷新重试</a>';
            document.getElementById("retry-link")?.addEventListener("click", (e) => {
              e.preventDefault();
              location.reload();
            });
          }
        }
      }, 35000);
    </script>
  </body>
</html>
