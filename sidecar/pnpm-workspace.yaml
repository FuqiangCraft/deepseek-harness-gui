# pnpm 工作区配置（Sidecar 独立包）
# 说明: 单一 @deepseek-ai/cordis 实例是 dsh 引擎 peer 依赖的硬性要求，
# 使用 hoisted 布局保证全进程只有一个 cordis；显式允许原生依赖执行构建脚本。
packages:
  - .

nodeLinker: hoisted

patchedDependencies:
  '@deepseek-ai/dsh-sandbox-windows-acl': patches/dsh-sandbox-windows-acl@0.1.0-rc.7.patch
  '@deepseek-ai/dsh-llm-deepseek': patches/dsh-llm-deepseek@0.1.0-rc.7.patch
  '@deepseek-ai/dsh-client-ui-conversation': patches/dsh-client-ui-conversation@0.1.0-rc.7.patch
  '@deepseek-ai/dsh-client-ui-settings-general': patches/dsh-client-ui-settings-general@0.1.0-rc.7.patch

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  koffi: true
  node-pty: true
  protobufjs: true

onlyBuiltDependencies:
  - koffi
  - node-addon-require-builtin
