# 文件说明: 自动检查 npm、Cargo 与 GitHub Actions 依赖更新。
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: "/sidecar"
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
