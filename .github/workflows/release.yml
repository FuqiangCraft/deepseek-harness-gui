name: "Release Multi-Platform Desktop"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
          - platform: "macos-13"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file

      - name: Install dependencies
        run: |
          npm install
          cd sidecar && pnpm install --frozen-lockfile && cd ..

      - name: Build Frontend and Bundle Sidecar
        run: npm run build:all

      - name: Configure code signing (only when secrets are provided)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # tauri-bundler reads these env vars for signing; an empty value is treated
          # as "configured" and triggers an empty-certificate import, so only export
          # non-empty secrets to GITHUB_ENV for the subsequent tauri build process.
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE=${APPLE_CERTIFICATE}" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERTIFICATE_PASSWORD}" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY}" >> "$GITHUB_ENV"
            echo "APPLE_ID=${APPLE_ID}" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=${APPLE_PASSWORD}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}" >> "$GITHUB_ENV"
          fi
          if [ -n "${WINDOWS_CERTIFICATE:-}" ]; then
            echo "WINDOWS_CERTIFICATE=${WINDOWS_CERTIFICATE}" >> "$GITHUB_ENV"
            echo "WINDOWS_CERTIFICATE_PASSWORD=${WINDOWS_CERTIFICATE_PASSWORD}" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri Desktop and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DeepSeek Harness Desktop ${{ github.ref_name }}"
          releaseBody: |
            **DeepSeek Harness Desktop** - a cross-platform desktop client for the official DeepSeek Harness (dsh) engine, built on Tauri 2.0.

            ## Platforms
            - Windows x64 (NSIS / MSI)
            - macOS (Apple Silicon / Intel, DMG)
            - Linux (AppImage / deb / rpm)

            ## Install
            Download the installer for your platform. No Node.js or Rust installation is required; the engine is extracted automatically on first launch.

            > Unsigned builds may trigger Windows SmartScreen / macOS Gatekeeper prompts. See SECURITY.md for the security model and for reporting issues.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
