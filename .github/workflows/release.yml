name: "Release Multi-Platform Desktop"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            bundles: "nsis"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            bundles: "dmg"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            bundles: "dmg"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            bundles: "appimage,deb"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file xvfb

      - name: Install dependencies
        run: |
          npm ci
          cd sidecar && pnpm install --frozen-lockfile && cd ..

      - name: Verify third-party licenses
        run: npm run licenses:check

      - name: Build Frontend and Bundle Sidecar
        run: npm run build:all

      - name: Verify bundled runtime resources
        run: npm run bundle:verify

      - name: Configure code signing (only when secrets are provided)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || [ -z "${TAURI_UPDATER_PUBLIC_KEY:-}" ]; then
            echo "Release requires Tauri updater signing and public keys" >&2
            exit 1
          fi
          # Platform code-signing credentials are optional: when missing the
          # build proceeds unsigned (SmartScreen/Gatekeeper may warn) and the
          # release body already discloses this. Only export configured values.
          if [ "${RUNNER_OS}" = "macOS" ] && { [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; }; then
            echo "::warning::macOS signing/notarization credentials missing; producing an unsigned build"
          fi
          if [ "${RUNNER_OS}" = "Windows" ] && [ -z "${WINDOWS_CERTIFICATE:-}" ]; then
            echo "::warning::Windows code-signing certificate missing; producing an unsigned build"
          fi
          # tauri-bundler reads these env vars for signing; an empty value is treated
          # as "configured" and triggers an empty-certificate import, so only export
          # non-empty secrets to GITHUB_ENV for the subsequent tauri build process.
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE=${APPLE_CERTIFICATE}" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERTIFICATE_PASSWORD}" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY}" >> "$GITHUB_ENV"
            echo "APPLE_ID=${APPLE_ID}" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=${APPLE_PASSWORD}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}" >> "$GITHUB_ENV"
          fi
          if [ -n "${WINDOWS_CERTIFICATE:-}" ]; then
            echo "WINDOWS_CERTIFICATE=${WINDOWS_CERTIFICATE}" >> "$GITHUB_ENV"
            echo "WINDOWS_CERTIFICATE_PASSWORD=${WINDOWS_CERTIFICATE_PASSWORD}" >> "$GITHUB_ENV"
          fi
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<TAURI_KEY_EOF'
            echo "${TAURI_SIGNING_PRIVATE_KEY}"
            echo 'TAURI_KEY_EOF'
          } >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" >> "$GITHUB_ENV"
          {
            echo 'TAURI_UPDATER_PUBLIC_KEY<<TAURI_PUB_EOF'
            echo "${TAURI_UPDATER_PUBLIC_KEY}"
            echo 'TAURI_PUB_EOF'
          } >> "$GITHUB_ENV"

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if (-not $certificate.Thumbprint) { throw 'Failed to import Windows signing certificate' }
          "TAURI_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item -LiteralPath $pfxPath -Force

      - name: Configure release signing and updater public key
        run: node scripts/configure-release.js

      - name: Build Tauri Desktop and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DeepSeek Harness GUI ${{ github.ref_name }}"
          releaseBody: |
            **DeepSeek Harness GUI** - a cross-platform desktop client for the official DeepSeek Harness (dsh) engine, built on Tauri 2.0.

            ## Platforms
            - Windows x64 (NSIS / MSI)
            - macOS (Apple Silicon / Intel, DMG)
            - Linux (AppImage / deb / rpm)

            ## Install
            Download the installer for your platform. No Node.js or Rust installation is required; the engine is extracted automatically on first launch.

            > Unsigned builds may trigger Windows SmartScreen / macOS Gatekeeper prompts. See SECURITY.md for the security model and for reporting issues.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Verify Windows Authenticode signature
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          $binary = "src-tauri/target/${{ matrix.target }}/release/deepseek-harness-gui.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $binary
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($signature.Status)" }

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          APP_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -name '*.app' -maxdepth 2 -print -quit)
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Install and smoke test Windows NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found' }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $installed = Get-ChildItem "$env:LOCALAPPDATA\DeepSeek Harness GUI" -Recurse -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $installed) { throw 'Installed application executable not found' }
          $env:HARNESS_SMOKE_EXECUTABLE = $installed.FullName
          node scripts/smoke-desktop.js
          $uninstaller = Get-ChildItem "$env:LOCALAPPDATA\DeepSeek Harness GUI" -Recurse -Filter '*uninstall*.exe' | Select-Object -First 1
          if ($uninstaller) { Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait }
          Start-Sleep -Seconds 3
          if (Test-Path "$env:LOCALAPPDATA\DeepSeek Harness GUI") { throw 'NSIS uninstall left application files behind' }

      - name: Install and smoke test macOS DMG
        if: runner.os == 'macOS'
        run: |
          DMG=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -print -quit)
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse
          APP=$(find "$MOUNT" -maxdepth 1 -name '*.app' -print -quit)
          cp -R "$APP" "$RUNNER_TEMP/DeepSeek Harness GUI.app"
          hdiutil detach "$MOUNT"
          export HARNESS_SMOKE_EXECUTABLE="$RUNNER_TEMP/DeepSeek Harness GUI.app/Contents/MacOS/deepseek-harness-gui"
          node scripts/smoke-desktop.js
          rm -rf "$RUNNER_TEMP/DeepSeek Harness GUI.app"

      - name: Install and smoke test Linux packages
        if: runner.os == 'Linux'
        run: |
          APPIMAGE=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/appimage" -name '*.AppImage' -print -quit)
          chmod +x "$APPIMAGE"
          HARNESS_SMOKE_EXECUTABLE="$APPIMAGE" HARNESS_SMOKE_WRAPPER=xvfb-run node scripts/smoke-desktop.js
          mv startup-performance.json startup-performance-appimage.json
          DEB=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/deb" -name '*.deb' -print -quit)
          sudo apt-get install -y "$DEB"
          HARNESS_SMOKE_EXECUTABLE="$(command -v deepseek-harness-gui)" HARNESS_SMOKE_WRAPPER=xvfb-run node scripts/smoke-desktop.js
          mv startup-performance.json startup-performance-deb.json
          sudo apt-get remove -y deepseek-harness-gui

      - name: Upload release verification reports
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ matrix.target }}
          path: |
            bundle-size-report.json
            startup-performance*.json

  publish-release:
    needs: build-and-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish verified draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
