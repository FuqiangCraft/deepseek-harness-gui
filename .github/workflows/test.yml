name: "CI"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential curl wget file xvfb

      - name: Install dependencies
        run: |
          npm ci
          cd sidecar && pnpm install --frozen-lockfile && cd ..

      - name: Verify third-party licenses
        run: npm run licenses:check

      - name: Build frontend and bundle sidecar
        run: npm run build:all

      - name: Verify bundled runtime resources
        run: npm run bundle:verify

      - name: Upload bundle size report
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: bundle-size-${{ matrix.target }}
          path: bundle-size-report.json

      - name: Run Rust unit tests
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum -- ' || '' }}cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Run Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
