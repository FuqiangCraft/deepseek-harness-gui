name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  dependency-audit:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: npm ci
      - run: cd sidecar && pnpm install --frozen-lockfile
      - run: npm audit --audit-level=high
      - run: cd sidecar && pnpm audit --audit-level=high
      # RUSTSEC-2024-0429 仅存在于未发布的 Linux GTK3 依赖树；Tauri 当前
      # WebKitGTK 栈尚无兼容修复版本。恢复 Linux 官方发布前必须移除此忽略项。
      - run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2024-0429
      - run: npm run licenses:check

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
        with:
          output: results
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: codeql-results
          path: results
